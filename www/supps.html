<!DOCTYPE html>
<html>
    <head>
        <title>Cofactor</title>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
        <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
        <script src="ocr.js"></script>
        <script>
            let recent_popup = null
            const fallbackItems = [
                "Iron", "Calcium", "Magnesium", "Zinc", "Copper", "Potassium",
                "Vitamin D3", "Vitamin K2", "Vitamin C", "Vitamin B12", "Folate",
                "Ibuprofen", "Acetaminophen", "Omeprazole", "Levothyroxine",
                "Metformin", "Lisinopril", "Atorvastatin", "Warfarin", "Sertraline",
                "Fish Oil", "St. John's Wort", "Ashwagandha", "Melatonin", "Green Tea Extract"
            ];

            async function initSupps() {
                if (window.loadData) loadData();
                if (window.loadJSON) {
                    try { await loadJSON(); } catch (e) { console.warn(e); }
                }
                await
                populate();
                renderSupps();
            }

            function populate() {
                const select = document.getElementById("medselect");
                if (!select) return;
                const itemsList = (window.data && window.data.items) ? window.data.items : fallbackItems;

                select.innerHTML = "<option value='' disabled selected hidden>Choose Medication</option>";
                for (const item of itemsList) {
                    const name = typeof item === 'string' ? item : item.name;
                    select.innerHTML += "<option value='" + name + "'>" + name + "</option>";
                } 
            }

            function initSearch(){
                const searchInput = document.getElementById("site-search");
                if (!searchInput) return;

                searchInput.addEventListener("input", function() {
                    const query = searchInput.value.toLowerCase();
                    const autocorrectDiv = document.getElementById("autocorrect");
                    autocorrectDiv.innerHTML = "";

                    if (query.length === 0) return;

                    const itemsList = (window.data && window.data.items) ? window.data.items : fallbackItems;
                    
                    const filteredItems = itemsList.filter(item => {
                        const name = typeof item === 'string' ? item : item.name;
                        return name.toLowerCase().includes(query);
                    });

                    filteredItems.forEach(item => {
                        const name = typeof item === 'string' ? item : item.name;
                        const itemDiv = document.createElement("div");
                        itemDiv.className = "autocorrect-item";
                        itemDiv.textContent = name;
                        itemDiv.onclick = () => {
                            searchInput.value = name;
                            autocorrectDiv.innerHTML = "";
                        };
                        autocorrectDiv.appendChild(itemDiv);
                    });
                });
            }
            
            function renderSupps() {
                const rackbody = document.getElementById("rackbodyx");
                if (!rackbody) return;
                rackbody.innerHTML = "";
                
                const saved = localStorage.getItem("meds");
                const activeSupps = saved ? JSON.parse(saved) : (window.supps || []);
                
                activeSupps.forEach((med, index) => {
                    const suppdiv = document.createElement("div");
                    suppdiv.onclick = (event) => {
                        event.stopPropagation();
                        showInfo(index, suppdiv.offsetLeft + 12, suppdiv.offsetTop - 59, med);
                    };
                    suppdiv.className = "supplement";
                    
                    const name = Array.isArray(med) ? med[0] : (med.medication || "Unknown");
                    const count = Array.isArray(med) ? med[1] : (med.dpw || 0);
                    
                    suppdiv.innerHTML = `
                        <p style="position: relative !important;">
                            ${name}<br><br> (${count}/week)
                        </p>
                    `;
                    rackbody.appendChild(suppdiv);
                });
            }

            function showInfo(index, x, y, labelin){
                bigPop = document.getElementById("mobilepopup");
                if (!bigPop) return;

                document.querySelector("#closePopup").onclick = () => {
                    removeMed(index)
                    bigPop.hidden = true;
                };
                if (!bigPop) return;
                
                if (window.data.table){
                    console.log(labelin)
                    const med = labelin;
                    medName = med[0].toLowerCase();
                    constructor = ""
                    for (const key in window.data.table[medName]){
                        constructor += `${key} ${ window.data.table[medName][key] > 0 ? '(Should Space)' : '(Cofactor)'} <br>`;
                    }
                    document.getElementById("pinfo").innerHTML = constructor;
                } else {
                    document.getElementById("pinfo").innerHTML = `Info goes here`;
                }

                bigPop.hidden = false;
                bigPop.style.left = x + "px";
                bigPop.style.top = y + "px";
            }

            function handleAddMed(m, d) {
                const select = m;
                const dose = d;
                
                if (select && select.value && dose && dose.value) {
                    const med = select.value;
                    const num = parseInt(dose.value, 10);
                    
                    let currentMeds = [];
                    try {
                        const stored = localStorage.getItem("meds");
                        if (stored) currentMeds = JSON.parse(stored);
                    } catch (e) { currentMeds = []; }

                    if (!Array.isArray(currentMeds)) currentMeds = [];

                    const index = currentMeds.findIndex(item => (Array.isArray(item) ? item[0] : item.medication) === med);
                    if (index !== -1) {
                        currentMeds[index] = [med, num];
                    } else {
                        currentMeds.push([med, num]);
                    }

                    localStorage.setItem("meds", JSON.stringify(currentMeds));
                    window.supps = currentMeds;
                    localStorage.removeItem("schedule");

                    renderSupps();
                    
                    select.value = "";
                    dose.value = "";
                    console.log(localStorage.getItem("meds"));
                }
            }

            function removeMed(index) {
                let currentMeds = [];
                try {
                    const stored = localStorage.getItem("meds");
                    if (stored) currentMeds = JSON.parse(stored);
                } catch (e) { currentMeds = []; }

                if (!Array.isArray(currentMeds)) return;

                currentMeds.splice(index, 1);

                localStorage.setItem("meds", JSON.stringify(currentMeds));
                window.supps = currentMeds;
                localStorage.removeItem("schedule");

                renderSupps();
            }

            

            async function scanMed() {
                importPhoto();                
            }

        </script>
    </head>
    <body onload="initSupps();initSearch();initOCR();">

        <div id="header">
            <img src="assets/Cofactor.png" style="width:75px;height:75px;margin:12.5px">
            <h1 id="maintitle">My Supplements</h1>
        </div>

        <div id="rackbodyx" class="shelf" onclick="document.getElementById('mobilepopup').hidden = true; console.log('hidden')"></div>

        <div id="knee">
            <!-- <select id="medselect">
                  <option value="" disabled selected hidden>Choose Medication</option>
            </select>
            <input type="number" id="doseinput" placeholder="#">
            <button id="plus" onclick="
            handleAddMed()
            ">+</button> -->
            <button onclick="document.getElementById('popup').hidden = false;">Add Medication</button>
        </div>

        <div id = "footer">
            <a href="index.html">
                <img src="assets/calendar.png" class="icon">
                <p>Calendar</p>
            </a>
            <div id="camcontainer">
                <button style="height:25vw;width:25vw;border-radius:100vw;background:#FF5757;margin-top:-50px;"><img src="assets/camera.png" style="height:100%;width:100%"></button>
            </div>
            <a href = "supps.html">
                <img src="assets/pills.png" class="icon">
                <p>Settings</p>
            </a>
        </div>
        
        <input type="file" id="fileInput" accept="image/png" onchange="handleFileSelect(event)" style="display: none;">
        <div id = "popup" style="position:absolute;top:0;left:0;width:100vw;height:100vh;background:#1c1c1cbe" hidden onclick="document.getElementById('popup').hidden = true">
                <div style="position:absolute;top:25vh;left:10vw;background:#fff;width:80vw;height:50vh;border-radius:10px;padding:20px;box-sizing:border-box;" onclick="event.stopPropagation(); ">
                <h2>Add Medication</h2>
                <input type="search" id="site-search" placeholder="Search..." autocomplete="off">
                <div id = "autocorrect"></div>
                <button style="width:70%" onclick="scanMed()">Scan Bottle</button>
                <div style="display: flex; justify-content: space-around">
                    <input id = 'no' placeholder="#" style="width:20%">
                    <button style="width:70%" onclick="handleAddMed(document.getElementById('site-search'), document.getElementById('no'));popup.hidden=true">Add Medication</button>
                </div>
            </div>
        </div>

        <div id="mobilepopup" hidden style="padding:15px">
            <div style="position:relative;left:75px;top:-100px;height:0;width:0;border: 50px solid #fff0;border-bottom:50px solid #fff"></div>
            <button id = "closePopup" style="position: absolute; top: 6px; right: 8px; background: pink; width: 50px; height: 50px; border-radius: 20000000%; font-size: 40px; color: #ff3b30; cursor: pointer;"><p style="margin-top:-7px">x</p></button>
            <p id="pinfo" style="margin-top:-80px; overflow-y:auto; height:200px"></p>
        </div>
    </body>
</html>
