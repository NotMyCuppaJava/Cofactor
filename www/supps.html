<!DOCTYPE html>
<html>
    <head>
        <title>Cofactor</title>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
        
        <script src="sched.js"></script>
        <script>
            let recent_popup = null
            const fallbackItems = [
                "Iron", "Calcium", "Magnesium", "Zinc", "Copper", "Potassium",
                "Vitamin D3", "Vitamin K2", "Vitamin C", "Vitamin B12", "Folate",
                "Ibuprofen", "Acetaminophen", "Omeprazole", "Levothyroxine",
                "Metformin", "Lisinopril", "Atorvastatin", "Warfarin", "Sertraline",
                "Fish Oil", "St. John's Wort", "Ashwagandha", "Melatonin", "Green Tea Extract"
            ];

            async function initSupps() {
                if (window.loadData) loadData();
                if (window.loadJSON) {
                    try { await loadJSON(); } catch (e) { console.warn(e); }
                }
                populate();
                renderSupps();
            }

            function populate() {
                const select = document.getElementById("medselect");
                if (!select) return;
                const itemsList = (window.data && window.data.items) ? window.data.items : fallbackItems;

                select.innerHTML = "<option value='' disabled selected hidden>Choose Medication</option>";
                for (const item of itemsList) {
                    select.innerHTML += "<option value='" + item + "'>" + item + "</option>";
                } 
            }
            
            function renderSupps() {
                const rackbody = document.getElementById("rackbodyx");
                if (!rackbody) return;
                rackbody.innerHTML = "";
                
                const saved = localStorage.getItem("meds");
                const activeSupps = saved ? JSON.parse(saved) : (window.supps || []);
                
                activeSupps.forEach((med, index) => {
                    const suppdiv = document.createElement("div");
                    suppdiv.onclick = () => showInfo(index);
                    suppdiv.className = "supplement";
                    
                    const name = Array.isArray(med) ? med[0] : (med.medication || "Unknown");
                    const count = Array.isArray(med) ? med[1] : (med.dpw || 0);
                    
                    
                    suppdiv.innerHTML = `
                        <p style="position: relative !important;">
                            ${name}<br><br> (${count}/week)
                        </p>
                    `;
                    rackbody.appendChild(suppdiv);
                });
            }
            function showInfo(index){
                console.log(index);
                if(recent_popup){
                    document.body.removeChild(recent_popup);
                }
                recent_popup = document.createElement("div");
                recent_popup.className = "popup";
                recent_popup.innerHTML = `HI ${index}`;
                recent_popup.style = `position: absolute; width: 100px; height: 100px; background-color: #fff; border: 1px solid #000; top: calc(190px + ${Math.floor(index/3)} * (60vw - 100px) * 0.53  + 40px ); left:  calc(190px + ${Math.floor(index%3)} * (60vw - 100px) * 0.65  - 65px );`;
                if(recent_popup){
                    document.body.appendChild(recent_popup);
                }
                console.log(recent_popup);

            }
            function handleAddMed() {
                const select = document.getElementById('medselect');
                const dose = document.getElementById('doseinput');
                
                if (select && select.value && dose && dose.value) {
                    const med = select.value;
                    const num = parseInt(dose.value, 10);
                    
                    let currentMeds = [];
                    try {
                        const stored = localStorage.getItem("meds");
                        if (stored) currentMeds = JSON.parse(stored);
                    } catch (e) { currentMeds = []; }

                    if (!Array.isArray(currentMeds)) currentMeds = [];

                    const index = currentMeds.findIndex(item => (Array.isArray(item) ? item[0] : item.medication) === med);
                    if (index !== -1) {
                        currentMeds[index] = [med, num];
                    } else {
                        currentMeds.push([med, num]);
                    }

                    localStorage.setItem("meds", JSON.stringify(currentMeds));
                    window.supps = currentMeds;
                    localStorage.removeItem("schedule");

                    renderSupps();
                    
                    select.selectedIndex = 0;
                    dose.value = "";
                }
            }

            function removeMed(index) {
                let currentMeds = [];
                try {
                    const stored = localStorage.getItem("meds");
                    if (stored) currentMeds = JSON.parse(stored);
                } catch (e) { currentMeds = []; }

                if (!Array.isArray(currentMeds)) return;

                currentMeds.splice(index, 1);

                localStorage.setItem("meds", JSON.stringify(currentMeds));
                window.supps = currentMeds;
                localStorage.removeItem("schedule");

                renderSupps();
            }
        </script>
    </head>
    <body onload="initSupps()">

        <div id="header">
            <img src="assets/Cofactor.png" style="width:75px;height:75px;margin:12.5px">
            <h1 id="maintitle">My Supplements</h1>
        </div>

        <div id="rackbodyx" class="shelf"></div>

        <div id="kneex">
            <select id="medselect">
                  <option value="" disabled selected hidden>Choose Medication</option>
            </select>
            <input type="number" id="doseinput" placeholder="#">
            <button id="plus" onclick="
            handleAddMed()
            ">+</button>
        </div>

        <div id="footer">
            <a href="index.html" onclick="window.saveData && saveData()">
                <center><img src="assets/calendar.png" class="icon"><p>Calendar</p></center>
            </a>
            <a href="supps.html" onclick="window.saveData && saveData()">
                <center><img src="assets/pills.png" class="icon"><p>Supplements</p></center>
            </a>
            <a>
                <center><img src="assets/settings.png" class="icon"><p>Settings</p></center>
            </a>
        </div>

    </body>
</html>
