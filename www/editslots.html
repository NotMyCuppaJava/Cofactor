<!DOCTYPE html>
<html>
    <head>
        <title>Cofactor</title>
        <link rel="stylesheet" href="style.css">
        <!-- FONTS below -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    </head>
    <body onload = "">
        <!-- loadData();makeSchedule([7.5, 12.0, 20.0]) -->
        <!-- <script src="main.js"></script> -->
        <script src="https://cdn.jsdelivr.net/npm/p5@2.3.1/lib/p5.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.min.js"></script>
        <script>
            async function setup() {
                console.log("STARTING UP")
                let c = createCanvas(windowWidth - 100, windowHeight*0.5)
                c.parent("canvascontainer")
                background(240)
            }

            function windowResized() {
                existing = document.getElementById("canvascontainer")
                const canvWidth = existing.offsetWidth
                const canvHeight = windowHeight * 0.5

                // Automatically recalculates canvas size on window resize
                resizeCanvas(canvWidth, canvHeight);
                background(240); // Clear or redraw elements after resize
                rect(canvWidth/2 - 10, 5, 20, canvHeight - 10)
            }
        </script>

        <div id = "header">
            <img src="assets/Cofactor.png" style="width:75px;height:75px;margin:12.5px">
            <h1 id = "maintitle">My Schedule</h1>
        </div>

        <div id = "rackbodyy">
            <p>Most medications are taken either early in the morning or with dinner. Supplements should be taken along with them. You can also opt to take some supplements with lunch if that fits with your schedule.</p>
            <div id="canvascontainer"></div>
        </div>

        <div id = "knee">
            <button onclick="window.location.href='index.html';startup()">Discard Changes</button>
            <button>Save Changes</button>
        </div>

        <div id = "footerx">
        </div>

    </body>
</html>
