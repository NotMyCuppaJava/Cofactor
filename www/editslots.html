<!DOCTYPE html>
<html>
    <head>
        <title>Cofactor</title>
        <link rel="stylesheet" href="style.css">
        <!-- FONTS below -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    </head>
    <body onload = "">
        <!-- loadData();makeSchedule([7.5, 12.0, 20.0]) -->
        <script src="main.js"></script>

        <div id = "header">
            <img src="assets/Cofactor.png" style="width:75px;height:75px;margin:12.5px">
            <h1 id = "maintitle">My Schedule</h1>
        </div>

        <div id = "rackbodyy">
            <p>Most medications are taken either early in the morning or with dinner. Supplements should be taken along with them. You can also opt to take some supplements with lunch if that fits with your schedule.</p>
            <div class = "sliders">
                <p>Breakfast</p>
                <input type="range" id = "breakfast" style="width: 100%" min="4" max="9" step="0.1" value="7">
                <div class = "numbers"><p>4AM</p><p>9AM</p></div>
            </div>
            <div class = "sliders">
                <p> <input type="checkbox"> Lunch (Check box if available)</p>
                <input type="range" id = "lunch" style="width: 100%" min="12" max="16" step="1" value="7">
                <div class = "numbers"><p>12PM</p><p>4PM</p></div>
            </div>
            <div class = "sliders">
                <p>Dinner</p>
                <input type="range" id = "dinner" style="width: 100%" min="16" max="24" step="1" value="7">
                <div class = "numbers"><p>4PM</p><p>12AM</p></div>
            </div>
        </div>

        <div id = "knee">
            <button onclick="window.location.href='index.html';startup()">Discard Changes</button>
            <button>Save Changes</button>
        </div>

        <div id = "footerx">
        </div>

    </body>
</html>
