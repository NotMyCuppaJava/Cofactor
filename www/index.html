<!DOCTYPE html>
<html>
    <head>
        <title>Cofactor</title>
        <link rel="stylesheet" href="style.css">
        <!-- FONTS below -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    </head>
    <body onload = "renderSchedule();boot()">
        <script src="sched.js"></script>
        <script>

            offset = 0

            function renderSchedule() {
                const daysoftheweek = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"]
                let schedule = JSON.parse(localStorage.getItem("schedule"))

                if (!schedule) {
                    console.log("No schedule found in local storage.")
                    return
                }
                const leftCol = document.getElementById("lcol")
                const midCol = document.getElementById("mcol")
                const rightCol = document.getElementById("rcol")

                lcolstring = ""
                mcolstring = ""
                rcolstring = ""

                today = new Date().getDay();

                lcolidx = ((today + offset - 1) % 7 + 7) % 7
                mcolidx = ((today + offset) % 7 + 7) % 7
                rcolidx = ((today + offset + 1) % 7 + 7) % 7

                lcolstring += '<h6 id = "lcolheader">' + daysoftheweek[lcolidx] + '</h6>'
                mcolstring += '<h6 id = "mcolheader">' + daysoftheweek[mcolidx] + '</h6>'
                rcolstring += '<h6 id = "rcolheader">' + daysoftheweek[rcolidx] + '</h6>'

                lcolinfo = schedule[lcolidx]
                for (time in lcolinfo){
                    lcolstring += '<div class="card"> <p>' + time.toString() + "<br><br>"
                    for(medication of lcolinfo[time]){
                        lcolstring += medication + "<br>"
                    }
                    lcolstring += '</p> </div>'
                    
                }
                mcolinfo = schedule[mcolidx]
                for (time in mcolinfo){
                    mcolstring += '<div class="card"> <p>' + time.toString() + "<br><br>"
                    for(medication of mcolinfo[time]){
                        mcolstring += medication + "<br>"
                    }
                    mcolstring += '</p> </div>'
                }
                rcolinfo = schedule[rcolidx]
                for (time in rcolinfo){
                    rcolstring += '<div class="card"> <p>' + time.toString() + "<br><br>"
                    for(medication of rcolinfo[time]){
                        rcolstring += medication + "<br>"
                    }
                    rcolstring += '</p> </div>'
                }

                leftCol.innerHTML = lcolstring
                midCol.innerHTML = mcolstring
                rightCol.innerHTML = rcolstring

            }

            function swipeDetect(el, callback){
                var touchSurface = el,
                swipeDir,
                startX,
                startY,
                distX,
                distY,
                threshold=150,
                restraint=100,
                allowedTime=300,
                elapsedTime,
                startTime,
                handleSwipe = callback || function(swipeDir){}

                touchSurface.addEventListener('touchstart', function(e){
                    var touchObj = e.changedTouches[0]
                    swipeDir = 'none'
                    dist = 0
                    startX = touchObj.pageX
                    startY = touchObj.pageY
                    startTime = new Date().getTime()
                    e.preventDefault()
                }, false)

                touchSurface.addEventListener('touchmove', function(e){
                    e.preventDefault()
                })

                touchSurface.addEventListener('touchend', function(e){
                    var touchobj = e.changedTouches[0]
                    distX = touchobj.pageX - startX
                    distY = touchobj.pageY - startY
                    elapsedTime = new Date().getTime() - startTime
                    if (elapsedTime <= allowedTime){
                        if (Math.abs(distX) >= threshold && Math.abs(distY) <= restraint){
                            swipeDir = (distX < 0) ? 'left' : 'right'
                        }
                        else if (Math.abs(distX) <= restraint && Math.abs(distY) >= threshold){
                            swipeDir = (distY < 0) ? 'up' : 'down'
                        }
                    }
                    console.log("Swipe! ", swipeDir)
                    handleSwipe(swipeDir);
                }, false)
            }

            function boot(){
                let rack = document.getElementById("rackbody")
                swipeDetect(rack, function(swipeDir){
                    if (swipeDir == 'left'){
                        offset += 1
                        renderSchedule()
                    }
                    else if (swipeDir == 'right'){
                        offset -= 1
                        renderSchedule()
                    }
                })
            }
        </script>

        <div id = "header">
            <img src="assets/Cofactor.png" style="width:75px;height:75px;margin:12.5px">
            <h1 id = "maintitle">My Schedule</h1>
        </div>

        <div id = "rackbody">
            <div id="leftcol" style="transform:rotateY(-20deg) scale(0.9)">
                <div class = "column" id = "lcol">
                        <h6 id = "lcolheader">Monday 8/7</h6>
                        <div class = "card">
                            <p> 8AM <br> <br> Prescriptions </p>
                        </div>
                        <div class = "card">
                            <p> 12PM <br> <br> Prescriptions </p>
                        </div>
                        <!-- <div class = "card">
                            <p> 10PM <br> <br> Prescriptions </p>
                        </div> -->
                </div>
            </div>
            <div id="midcol">
                <div class = "column" id = "mcol">
                        <h6 id = "mcolheader">Monday 8/7</h6>
                        <div class = "card">
                            <p> 8AM <br> <br> Prescriptions </p>
                        </div>
                        <div class = "card">
                            <p> 12PM <br> <br> Prescriptions </p>
                        </div>
                        <!-- <div class = "card">
                            <p> 10PM <br> <br> Prescriptions </p>
                        </div> -->
                </div>
            </div>
            <div id="rightcol" style="transform:rotateY(20deg) scale(0.9)">
                <div class = "column" id = "rcol">
                        <h6 id = "rcolheader">Monday 8/7</h6>
                        <div class = "card">
                            <p> 8AM <br> <br> Prescriptions </p>
                        </div>
                        <div class = "card">
                            <p> 12PM <br> <br> Prescriptions </p>
                        </div>
                        <!-- <div class = "card">
                            <p> 10PM <br> <br> Prescriptions </p>
                        </div> -->
                </div>
            </div>
        </div>

        <div id = "knee">
            <button onclick="window.location.href = 'editslots.html'">Edit my timeslots</button>
        </div>

        <div id = "footer">
            <a href="index.html">
                <img src="assets/calendar.png" class="icon">
                <p>Calendar</p>
            </a>
            <a href="supps.html">
                <img src="assets/pills.png" class="icon">
                <p>Supplements</p>
            </a>
            <a>
                <img src="assets/settings.png" class="icon">
                <p>Settings</p>
            </a>
        </div>

    </body>
</html>
