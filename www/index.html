<!DOCTYPE html>
<html>
    <head>
        <title>Cofactor</title>
        <link rel="stylesheet" href="style.css">
        <!-- FONTS below -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <body onload = "startup()">
        <!-- loadData();makeSchedule([7.5, 12.0, 20.0]) -->
        <script src="main.js"></script>

        <div id = "header">

        </div>

        <div id = "rackbody">

                        <div class = "card">
                            <p> 8AM <br> <br> Prescriptions </p>
                        </div>
                        <div class = "card">
                            <p> 12PM <br> <br> Prescriptions </p>
                        </div>
                        <!-- <div class = "card">
                            <p> 10PM <br> <br> Prescriptions </p>
                        </div> -->
                </div>
            </div>
            <div id="midcol">
                <div class = "column" id = "mcol">

                        <div class = "card">
                            <p> 8AM <br> <br> Prescriptions </p>
                        </div>
                        <div class = "card">
                            <p> 12PM <br> <br> Prescriptions </p>
                        </div>

                        </div> -->
                </div>
            </div>
            <div id="rightcol" style="transform:rotateY(20deg) scale(0.9)">
                <div class = "column" id = "rcol">
                        <h6 id = "rcolheader">Monday 8/7</h6>
                        <div class = "card">
                            <p> 8AM <br> <br> Prescriptions </p>
                        </div>
                        <div class = "card">
                            <p> 12PM <br> <br> Prescriptions </p>
                        </div>
                        <!-- <div class = "card">
                            <p> 10PM <br> <br> Prescriptions </p>
                        </div> -->
                </div>
            </div>
        </div>

        <div id = "knee">
            <button onclick="window.location.href = 'editslots.html'">Edit my timeslots</button>
        </div>

        <div id = "footer">
            <a href="index.html">
                <img src="assets/calendar.png" class="icon">
                <p>Calendar</p>
            </a>
            <a href="supps.html">
                <img src="assets/pills.png" class="icon">
                <p>Supplements</p>
            </a>
            <a>
                <img src="assets/settings.png" class="icon">
                <p>Settings</p>
            </a>
